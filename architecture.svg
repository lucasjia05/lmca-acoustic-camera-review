.rtl-modules .external{fill:#f5f7f9;stroke:#98a7af;stroke-width:1.4}
.rtl-modules .host{fill:#fff7e9;stroke:#ad854b;stroke-width:1.5;stroke-dasharray:7 5}
.rtl-modules .data{fill:none;stroke:#527d80;stroke-width:2;marker-end:url(#rtl-uart-arrow)}
.rtl-modules .control{fill:none;stroke:#9276ac;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#rtl-uart-control)}
