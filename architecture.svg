<svg xmlns="http://www.w3.org/2000/svg" class="rtl-modules" id="diagram" width="1700" height="1130" viewBox="0 0 1700 1130" role="img" aria-labelledby="rtl-module-title rtl-module-desc">
<title id="rtl-module-title">PDM-to-map architecture organized by SystemVerilog source files</title>
<desc id="rtl-module-desc">The generated lmca_configured_camera.sv wraps lmca_pdm_camera.sv. That top instantiates u_pdm and u_serializer, both defined in lmca_pdm_decimator.sv, and u_pcm from lmca_pcm_pipeline.sv. Inside the PCM pipeline are u_frames from lmca_frame_buffer.sv, u_window from lmca_window.sv, u_fft from lmca_fft.sv, u_bins from lmca_bin_selector.sv and u_das from lmca_das.sv. Solid arrows show sample and spectrum data. Dashed arrows show selected control and read-address connections. Controller logic is inside lmca_pcm_pipeline.sv, not a separate module. Physical PDM capture and the host are external.</desc>
<defs>
<marker id="rtl-module-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527d80"/></marker>
<marker id="rtl-module-control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9276ac"/></marker>
</defs>
<style>
.rtl-modules text{font-family:'Segoe UI',Arial,sans-serif;fill:#162b35}
.rtl-modules .filename{font-size:24px;font-weight:700;fill:#006e72}
.rtl-modules .name{font-size:22px;font-weight:650}
.rtl-modules .small{font-size:18px;fill:#536873}
.rtl-modules .tiny{font-size:16px;fill:#536873}
.rtl-modules .instance{font:17px Consolas,monospace;fill:#536873}
.rtl-modules .file{fill:#fbfdfc;stroke:#d7e0e3;stroke-width:1.5}
.rtl-modules .rootfile{fill:white;stroke:#a8b9bc;stroke-width:1.5;stroke-dasharray:8 5}
.rtl-modules .box{fill:white;stroke:#7da3a4;stroke-width:1.6}
.rtl-modules .logic{fill:#faf8fc;stroke:#b29bc5;stroke-width:1.4;stroke-dasharray:5 4}
.rtl-modules .external{fill:#f5f7f9;stroke:#98a7af;stroke-width:1.4}
.rtl-modules .host{fill:#fff7e9;stroke:#ad854b;stroke-width:1.5;stroke-dasharray:7 5}
.rtl-modules .data{fill:none;stroke:#527d80;stroke-width:2;marker-end:url(#rtl-module-arrow)}
.rtl-modules .control{fill:none;stroke:#9276ac;stroke-width:1.6;stroke-dasharray:5 4;marker-end:url(#rtl-module-control-arrow)}
.rtl-modules .rail{fill:none;stroke:#a7b2b7;stroke-width:1.4}
</style>
<rect width="1700" height="1130" fill="white"/>
<text x="225" y="35" class="small">Generated top: lmca_configured_camera.sv · active baseline</text>

<rect x="205" y="80" width="1460" height="875" rx="12" class="rootfile"/>
<text x="230" y="117" class="filename">lmca_pdm_camera.sv</text>
<text x="230" y="147" class="small">Instantiates u_pdm, u_serializer and u_pcm</text>
<text x="1640" y="117" class="small" text-anchor="end">busy · done · clipped · input_overrun</text>
<text x="230" y="185" class="tiny">clk / rst shared by clocked logic</text>
<path d="M230 203H1635 M420 203V257 M1145 203V257" class="rail"/>

<rect x="240" y="260" width="360" height="490" rx="10" class="file"/>
<text x="260" y="293" class="filename">lmca_pdm_decimator.sv</text>
<rect x="270" y="335" width="300" height="125" rx="7" class="box"/>
<text x="288" y="366" class="name">lmca_pdm_decimator</text>
<text x="288" y="392" class="instance">u_pdm</text>
<text x="288" y="420" class="small">CIC order 3 · ÷16 · normalize</text>
<text x="288" y="446" class="small">FIR: identity, 1 tap</text>
<rect x="270" y="590" width="300" height="105" rx="7" class="box"/>
<text x="288" y="622" class="name">lmca_pcm_serializer</text>
<text x="288" y="649" class="instance">u_serializer</text>
<text x="288" y="677" class="small">Parallel PCM → time-major stream</text>
<path d="M420 460V587" class="data"/>
<text x="437" y="519" class="small">30 × 16-bit</text>
<text x="437" y="544" class="small">PCM vector</text>

<rect x="20" y="335" width="165" height="125" rx="7" class="external"/>
<text x="37" y="365" class="small">Physical capture</text>
<text x="37" y="393" class="name">30 PDM bits</text>
<text x="37" y="421" class="tiny">Sampled / synchronized</text>
<text x="37" y="445" class="tiny">3.072 MHz nominal</text>
<path d="M185 397H267" class="data"/>
<text x="216" y="379" class="tiny" text-anchor="middle">PDM</text>

<rect x="650" y="260" width="985" height="650" rx="10" class="file"/>
<text x="675" y="293" class="filename">lmca_pcm_pipeline.sv</text>
<text x="1610" y="293" class="instance" text-anchor="end">u_pcm</text>
<path d="M570 642H625V397H697" class="data"/>
<text x="600" y="795" class="tiny" text-anchor="end">16-bit PCM · 192 ksample/s / mic</text>

<rect x="700" y="340" width="255" height="115" rx="7" class="box"/>
<text x="717" y="371" class="name">lmca_frame_buffer.sv</text>
<text x="717" y="397" class="instance">u_frames</text>
<text x="717" y="423" class="small">Circular observation buffer</text>
<text x="717" y="446" class="tiny">4096 / mic · map hop 2048</text>
<path d="M955 397H1017" class="data"/>
<text x="985" y="379" class="tiny" text-anchor="middle">PCM</text>

<rect x="1020" y="340" width="220" height="115" rx="7" class="box"/>
<text x="1037" y="371" class="name">lmca_window.sv</text>
<text x="1037" y="397" class="instance">u_window</text>
<text x="1037" y="423" class="small">ROM + multiply</text>
<text x="1037" y="446" class="tiny">sqrt-Hann · 24-bit output</text>
<path d="M1240 397H1297" class="data"/>
<text x="1270" y="379" class="tiny" text-anchor="middle">24-bit</text>

<rect x="1300" y="340" width="280" height="115" rx="7" class="box"/>
<text x="1317" y="371" class="name">lmca_fft.sv</text>
<text x="1317" y="397" class="instance">u_fft</text>
<text x="1317" y="423" class="small">Shared radix-2 FFT + twiddles</text>
<text x="1317" y="446" class="tiny">512 points · 24-bit real / imag</text>
<path d="M1440 455V647" class="data"/>
<text x="1456" y="499" class="tiny">257 bins / mic</text>

<rect x="1300" y="650" width="280" height="155" rx="7" class="box"/>
<text x="1317" y="681" class="name">lmca_bin_selector.sv</text>
<text x="1317" y="707" class="instance">u_bins</text>
<text x="1317" y="737" class="small">Spectrum RAM + bin selection</text>
<text x="1317" y="765" class="small">67 selected · 25–50 kHz</text>
<text x="1317" y="790" class="tiny">24-bit real / imaginary</text>

<rect x="1020" y="650" width="230" height="155" rx="7" class="box"/>
<text x="1037" y="681" class="name">lmca_das.sv</text>
<text x="1037" y="707" class="instance">u_das</text>
<text x="1037" y="737" class="small">Complex MAC + power</text>
<text x="1037" y="765" class="small">Map sum / normalization</text>
<text x="1037" y="790" class="tiny">Steering ROM + map RAM</text>
<path d="M1300 705H1253" class="data"/>
<path d="M1250 755H1297" class="control"/>
<text x="1275" y="834" class="tiny" text-anchor="middle">mic / bin read address →</text>

<rect x="700" y="650" width="255" height="155" rx="7" class="logic"/>
<text x="717" y="681" class="name">Controller</text>
<text x="717" y="707" class="small">Logic inside this file</text>
<text x="717" y="737" class="small">Mic / frame sequencing</text>
<text x="717" y="765" class="small">FFT → bins → DAS</text>
<text x="717" y="790" class="tiny">FFT hop 256 · 15 frames/map</text>
<path d="M827 650V458" class="control"/>
<text x="844" y="549" class="tiny">read offset</text>
<path d="M900 650V560H1610V680H1583" class="control"/>
<path d="M1130 560V458" class="control"/>
<path d="M1520 560V458" class="control"/>
<text x="1040" y="545" class="tiny">index / start / handshakes</text>
<path d="M955 690H1017" class="control"/>
<text x="986" y="678" class="tiny" text-anchor="middle">start</text>
<path d="M1020 755H958" class="control"/>
<text x="986" y="783" class="tiny" text-anchor="middle">done</text>

<path d="M1135 805V1027" class="data"/>
<text x="1153" y="867" class="small">441 direction values</text>
<text x="1153" y="893" class="tiny">64-bit power · 32-bit direction index</text>
<text x="1153" y="978" class="tiny">map_valid / map_ready · map_last</text>
<text x="240" y="846" class="tiny">Both front-end modules are defined</text>
<text x="240" y="871" class="tiny">in lmca_pdm_decimator.sv.</text>

<rect x="590" y="1030" width="285" height="75" rx="7" class="external"/>
<text x="610" y="1061" class="name">Camera</text>
