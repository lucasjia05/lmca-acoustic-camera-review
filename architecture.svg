<svg xmlns="http://www.w3.org/2000/svg" class="rtl-modules" id="diagram" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-labelledby="rtl-uart-title rtl-uart-desc">
<title id="rtl-uart-title">Compact acoustic camera with UART, organized by SystemVerilog source files</title>
<desc id="rtl-uart-desc">The generated lmca_compact_configured.sv instantiates u_camera from lmca_compact_camera.sv and u_uart from lmca_uart_map_tx.sv. The camera contains the PDM decimator, PCM serializer and compact core. Both front-end modules are defined in lmca_pdm_decimator.sv. The core contains windowing, one shared complex arithmetic engine, selected Fourier accumulators, power calculation, phase generation and its controller; these are logic within lmca_compact_core.sv, not separate module files. The core instantiates u_trig from lmca_compact_trig.sv. The UART packetizer instantiates u_tx, the byte transmitter defined in the same UART source file. Ready backpressure returns from the packetizer to the map producer. Physical capture, the host and the video camera are external.</desc>
<defs>
<marker id="rtl-uart-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527d80"/></marker>
<marker id="rtl-uart-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9276ac"/></marker>
</defs>
<style>
.rtl-modules text{font-family:'Segoe UI',Arial,sans-serif;fill:#162b35}
.rtl-modules .filename{font-size:24px;font-weight:700;fill:#006e72}
