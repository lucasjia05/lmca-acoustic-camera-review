<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1200" id="diagram" viewBox="0 0 1400 1200" role="img" aria-labelledby="title description">
<title id="title">Acoustic camera macroarchitecture</title>
<desc id="description">The main processing flow is vertical within an ASIC boundary. The external microphone array connects horizontally to the microphone interface. CIC decimation, frame buffer and window, FFT or Goertzel, and bin selection and spectrum buffer feed a horizontal beamformer: phase alignment, microphone sum, power calculation, and bin power sum. Steering coefficients feed phase alignment. The output returns to the vertical map-buffer and UART flow. The microphone array, camera, and host are outside the ASIC. Blocks describe logical functions; hardware sharing and bit widths remain provisional.</desc>
<style>
.block { fill: #25354a; stroke: #8dbaff; stroke-width: 1.5; rx: 8; }
.boundary { fill: #1b2230; stroke: #75869f; stroke-width: 1.5; stroke-dasharray: 8 5; rx: 14; }
.group { fill: #202b3b; stroke: #7694be; stroke-width: 1.5; rx: 12; }
text { fill: #e8edf5; font-family: Arial, sans-serif; text-anchor: middle; }
.label { font-size: 18px; }
.signal { font-size: 15px; fill: #bfccdf; }
.heading { font-size: 18px; font-weight: bold; }
.wire { fill: none; stroke: #b5c7df; stroke-width: 2; marker-end: url(#arrow); }
.clock { stroke: #e5bb78; marker-end: url(#clock-arrow); }
</style>
