<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 880" role="img" aria-labelledby="title desc">
<title id="title">Frequency-domain DAS software block diagram</title>
<desc id="desc">Microphone samples flow through framing and windowing, FFT, frequency selection, phase alignment, microphone summation, power calculation, and averaging into a directional power map. Steering coefficients feed phase alignment. Peak finding and image display use the output map.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66818b"/></marker></defs>
<style>text{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#162b35}.block{fill:#edf8f6;stroke:#007e81;stroke-width:1.6}.side{fill:#f5f7f9;stroke:#83949e;stroke-width:1.5}.arrow{fill:none;stroke:#66818b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="780" height="880" fill="white"/>
<rect x="270" y="20" width="360" height="56" rx="8" class="block"/><text x="450" y="55" text-anchor="middle">Microphone samples (PCM)</text>
<path d="M450 76V102" class="arrow"/>
<rect x="270" y="104" width="360" height="56" rx="8" class="block"/><text x="450" y="139" text-anchor="middle">Frame &amp; window</text>
<path d="M450 160V186" class="arrow"/>
<rect x="270" y="188" width="360" height="56" rx="8" class="block"/><text x="450" y="223" text-anchor="middle">FFT per microphone</text>
<path d="M450 244V270" class="arrow"/>
<rect x="270" y="272" width="360" height="56" rx="8" class="block"/><text x="450" y="307" text-anchor="middle">Select frequency bins</text>
<path d="M450 328V354" class="arrow"/>
<rect x="270" y="356" width="360" height="56" rx="8" class="block"/><text x="450" y="391" text-anchor="middle">Phase alignment</text>
<path d="M450 412V438" class="arrow"/>
<rect x="270" y="440" width="360" height="56" rx="8" class="block"/><text x="450" y="475" text-anchor="middle">Sum microphones</text>
<path d="M450 496V522" class="arrow"/>
<rect x="270" y="524" width="360" height="56" rx="8" class="block"/><text x="450" y="559" text-anchor="middle">Calculate power</text>
<path d="M450 580V606" class="arrow"/>
<rect x="270" y="608" width="360" height="56" rx="8" class="block"/><text x="450" y="643" text-anchor="middle">Sum bins &amp; average frames</text>
<path d="M450 664V690" class="arrow"/>
<rect x="270" y="692" width="360" height="56" rx="8" class="block"/><text x="450" y="727" text-anchor="middle">Directional power map</text>
<rect x="10" y="356" width="230" height="56" rx="8" class="side"/><text x="125" y="391" text-anchor="middle" style="font-size:19px">Steering coefficients</text><path d="M240 384H268" class="arrow"/>
<path d="M450 748V776H325V798" class="arrow"/><path d="M450 776H625V798" class="arrow"/>
<rect x="200" y="800" width="250" height="56" rx="8" class="side"/><text x="325" y="835" text-anchor="middle">Find peak directions</text>
<rect x="500" y="800" width="250" height="56" rx="8" class="side"/><text x="625" y="835" text-anchor="middle">Display heatmap</text>
</svg>