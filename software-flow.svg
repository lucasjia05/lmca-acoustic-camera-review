<text x="405" y="684" class="heading">3 · Delay and sum</text>
<rect x="430" y="105" width="550" height="80" rx="8" class="block"/>
<text x="705.0" y="152" text-anchor="middle" class="label">PCM samples for each microphone</text>
<rect x="20" y="110" width="320" height="70" rx="8" class="input"/>
<text x="180" y="152.0" text-anchor="middle" class="inputtext">PCM sampling rate</text>
<path d="M340 145H427" class="arrow"/>
<path d="M705 185V296" class="arrow"/>
<rect x="430" y="300" width="550" height="60" rx="8" class="block"/>
<text x="705.0" y="337" text-anchor="middle" class="label">Consecutive samples &#8594; FFT frame</text>
<rect x="20" y="285" width="320" height="90" rx="8" class="input"/>
<text x="180" y="324.0" text-anchor="middle" class="inputtext">Observation length</text>
<text x="180" y="350.0" text-anchor="middle" class="inputtext">FFT size N · frame hop · window</text>
<path d="M340 330H427" class="arrow"/>
<path d="M705 360V396" class="arrow"/>
<rect x="430" y="400" width="550" height="75" rx="8" class="block"/>
<text x="705.0" y="445" text-anchor="middle" class="label">Window + FFT &#8594; amplitude and phase</text>
<path d="M705 475V506" class="arrow"/>
<rect x="430" y="510" width="550" height="55" rx="8" class="block"/>
<text x="705.0" y="545" text-anchor="middle" class="label">Select frequency bins</text>
<rect x="20" y="500" width="320" height="75" rx="8" class="input"/>
<text x="180" y="531.5" text-anchor="middle" class="inputtext">Frequency band</text>
<text x="180" y="557.5" text-anchor="middle" class="inputtext">Bin selection</text>
<path d="M340 537H427" class="arrow"/>
<path d="M705 565V711" class="arrow"/>
<text x="720" y="613" class="small">M microphones × K selected bins / frame</text>
<rect x="460" y="715" width="490" height="75" rx="8" class="block"/>
<text x="705.0" y="760" text-anchor="middle" class="label">Predict phase at this microphone</text>
<rect x="20" y="710" width="320" height="100" rx="8" class="input"/>
<text x="180" y="737" text-anchor="middle" class="inputtext">Scan FOV + scan-grid step</text>
<text x="180" y="764" text-anchor="middle" class="inputtext">Mic positions + sound speed</text>
<text x="180" y="791" text-anchor="middle" class="inputtext">Focus distance (if used)</text>
<path d="M340 752H457" class="arrow"/>
<text x="180" y="846" text-anchor="middle" class="small">Each direction &#215; bin &#215; FFT frame:</text>
<text x="180" y="871" text-anchor="middle" class="small">align M microphones, then sum.</text>
