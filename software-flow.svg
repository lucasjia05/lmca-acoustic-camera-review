<path d="M705 1400V1497" class="arrow"/>
<rect x="430" y="1500" width="550" height="90" rx="8" class="output"/>
<text x="705.0" y="1542" text-anchor="middle" class="label">Find peaks · evaluate · display</text>
<text x="705" y="1567" text-anchor="middle" class="small">Outside the algorithm</text>
<path d="M1035 300H1048V1400H1035" fill="none" stroke="#98a7af" stroke-width="1.5"/>
<text x="1070" y="325" class="code">configured_power_map()</text>
<text x="1070" y="445" class="code">Precision.fft()</text>
<text x="1070" y="760" class="code">arrival_delays()</text>
