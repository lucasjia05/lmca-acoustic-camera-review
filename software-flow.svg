<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1620" role="img" aria-labelledby="title desc">
<title id="title">Frequency-domain delay-and-sum: samples, FFT, direction sweep</title>
<desc id="desc">Microphone PCM samples flow through framing, FFT and frequency-bin selection, then phase prediction, phase alignment, complex summation and power calculation to produce a directional power map. A side bracket identifies configured_power_map() from frame preparation through the map, with helper function names aligned to their steps. Configuration inputs connect where first used. Peak finding, evaluation and display share a separate output block.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66818b"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#162b35}.label{font-size:22px;font-weight:600}.small{font-size:17px;fill:#536873}.code{font-family:Consolas,monospace;font-size:17px;fill:#536873}.inputtext{font-size:19px}.heading{font-size:23px;font-weight:700;fill:#006e72}.section{fill:#fbfdfc;stroke:#d7e0e3;stroke-width:1.5}.block{fill:white;stroke:#007e81;stroke-width:1.7}.input{fill:#f5f7f9;stroke:#98a7af;stroke-width:1.4}.output{fill:#fff7e9;stroke:#ad854b;stroke-width:1.7;stroke-dasharray:7 5}.arrow{fill:none;stroke:#66818b;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1360" height="1620" fill="white"/>
<text x="180" y="33" text-anchor="middle" class="small">Configuration inputs · first use</text>
