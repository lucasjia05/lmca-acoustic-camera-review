<text x="560.0" y="763" class="node" text-anchor="middle">Fourier registers</text>
<rect x="438" y="778" width="49" height="40" rx="6" class="box"/>
<text x="462.5" y="805" class="tiny" text-anchor="middle">m0</text>
<rect x="503" y="778" width="49" height="40" rx="6" class="box"/>
<text x="527.5" y="805" class="tiny" text-anchor="middle">m1</text>
<rect x="568" y="778" width="49" height="40" rx="6" class="box"/>
<text x="592.5" y="805" class="tiny" text-anchor="middle">…</text>
<rect x="633" y="778" width="49" height="40" rx="6" class="box"/>
<text x="657.5" y="805" class="tiny" text-anchor="middle">m29</text>
<path d="M425 785H405V582H425" class="flow"/>
<path d="M560 710V735" class="write"/>
<text x="410" y="918" class="small">Values stay in place; access is selected.</text>
<text x="25" y="962" class="small">Controller: microphones outside bins; one sample held at a time.</text>
<text x="25" y="998" class="tiny">Solid arrows: data / read     Dashed arrows: DFT write-back</text>
</g>
<g transform="translate(820 0)">
