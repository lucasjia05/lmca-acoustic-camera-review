<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="rotation-title rotation-desc">
<title id="rotation-title">Storage optimization inside the existing core architecture</title>
<desc id="rotation-desc">Close-up of lmca_compact_core.sv, using the main diagram's layout: Window plus sample hold on the upper left feeds Shared complex arithmetic on the upper right, with Fourier storage below the arithmetic. The optimized version replaces indexed register access with continuously rotating Fourier banks and buffers one windowed sample per microphone. Whole-chip gates for the same 30-microphone, N256, 10-bin, 24-bit design drop from 265.7k to 199.5k. All Fourier values and tested map results are preserved.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527d80"/></marker>
<marker id="write-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9276ac"/></marker>
</defs>
<style>
text{font-family:'Segoe UI',Arial,sans-serif;fill:#162b35;font-size:20px}
.heading{font-size:25px;font-weight:650}.label{font-size:21px;font-weight:650}.block-title{font-size:18px;font-weight:650}
.muted{font-size:18px;fill:#536873}.small{font-size:16px;fill:#536873}.file{font-size:17px;fill:#006e72}
.panel{fill:#fbfdfc;stroke:#d7e0e3;stroke-width:1.5}.box{fill:white;stroke:#7da3a4;stroke-width:1.5}
.extra{fill:#faf8fc;stroke:#b29bc5;stroke-width:1.5}.head{fill:#e0f1ed;stroke:#006e72;stroke-width:2}
.flow{fill:none;stroke:#527d80;stroke-width:2;marker-end:url(#arrow)}
.write{fill:none;stroke:#9276ac;stroke-width:1.7;stroke-dasharray:5 4;marker-end:url(#write-arrow)}
.gate{font-size:32px;font-weight:700}.accent{fill:#006e72}
</style>
<rect width="1200" height="850" fill="white"/>
<text x="24" y="28" class="muted">Close-up of lmca_compact_core.sv · same block positions as the main diagram</text>
<rect x="20" y="50" width="560" height="540" rx="10" class="panel"/>
<rect x="620" y="50" width="560" height="540" rx="10" class="panel"/>
<text x="44" y="92" class="heading">Before · indexed storage</text>
<text x="644" y="92" class="heading">After · continuous rotation</text>
<text x="44" y="129" class="file">lmca_compact_core.sv / u_core</text>
<text x="644" y="129" class="file">lmca_compact_core.sv / u_core</text>

<!-- The layout follows the existing overall architecture: sample block left,
     shared arithmetic right, Fourier banks directly below that arithmetic. -->
<rect x="44" y="160" width="224" height="110" rx="7" class="box"/>
<text x="58" y="193" class="block-title">Window + sample hold</text>
<text x="58" y="237" class="muted">1 windowed sample</text>
<path d="M268 215H307" class="flow"/>
<rect x="310" y="160" width="246" height="110" rx="7" class="box"/>
<text x="433" y="192" class="label" text-anchor="middle">Shared complex</text>
<text x="433" y="218" class="label" text-anchor="middle">arithmetic</text>
<text x="433" y="250" class="muted" text-anchor="middle">DFT / DAS</text>

<text x="44" y="340" class="muted">Values stay in place;</text>
<text x="44" y="367" class="muted">selectors choose what</text>
<text x="44" y="394" class="muted">reaches the arithmetic.</text>
<rect x="310" y="300" width="246" height="56" rx="7" class="extra"/>
<text x="433" y="335" class="label" text-anchor="middle">Read selector</text>
<path d="M399 300V273" class="flow"/>
<rect x="310" y="385" width="246" height="126" rx="7" class="box"/>
<text x="433" y="417" class="label" text-anchor="middle">Fourier registers</text>
<rect x="326" y="442" width="45" height="42" rx="4" class="box"/><text x="348" y="470" text-anchor="middle" class="muted">m0</text>
<rect x="381" y="442" width="45" height="42" rx="4" class="box"/><text x="403" y="470" text-anchor="middle" class="muted">m1</text>
<rect x="436" y="442" width="45" height="42" rx="4" class="box"/><text x="458" y="470" text-anchor="middle" class="muted">…</text>
<rect x="491" y="442" width="45" height="42" rx="4" class="box"/><text x="513" y="470" text-anchor="middle" class="muted">m29</text>
<path d="M348 385V359M433 385V359M513 385V359" class="flow"/>
<path d="M550 247H568V460H559" class="write"/>
<text x="310" y="542" class="small">Selection + write / hold logic</text>
<text x="310" y="565" class="small">Dashed line: DFT write-back</text>

<rect x="644" y="160" width="224" height="110" rx="7" class="head"/>
<text x="658" y="193" class="block-title">Window + sample hold</text>
<text x="658" y="228" class="small">Buffer: 1 sample per mic</text>
<text x="658" y="253" class="small">30 × 18 bits total</text>
<path d="M868 215H907" class="flow"/>
<rect x="910" y="160" width="246" height="110" rx="7" class="box"/>
<text x="1033" y="192" class="label" text-anchor="middle">Shared complex</text>
<text x="1033" y="218" class="label" text-anchor="middle">arithmetic</text>
<text x="1033" y="250" class="muted" text-anchor="middle">Same DFT / DAS</text>

<text x="644" y="340" class="muted">For each bin, visit</text>
<text x="644" y="367" class="muted">the mics in order.</text>
<text x="644" y="410" class="small">The sample buffer follows</text>
<text x="644" y="434" class="small">the rotating data.</text>
<rect x="850" y="360" width="306" height="170" rx="7" class="box"/>
<text x="1003" y="393" class="label" text-anchor="middle">Rotating Fourier banks</text>
<rect x="865" y="416" width="56" height="48" rx="5" class="head"/><text x="893" y="447" text-anchor="middle">m0</text>
<rect x="936" y="416" width="56" height="48" rx="5" class="box"/><text x="964" y="447" text-anchor="middle">m1</text>
<rect x="1007" y="416" width="56" height="48" rx="5" class="box"/><text x="1035" y="447" text-anchor="middle">…</text>
<rect x="1078" y="416" width="56" height="48" rx="5" class="box"/><text x="1106" y="447" text-anchor="middle">m29</text>
<path d="M936 440H923M1007 440H994M1078 440H1065" class="flow"/>
<path d="M893 464V499H1106V467" class="flow"/>
<text x="1000" y="519" class="small" text-anchor="middle">Head returns to tail · one bank per bin</text>
<path d="M975 360V273" class="flow"/>
<text x="925" y="337" class="small">read</text>
<path d="M1070 270V316H1168V485H1106" class="write"/>
<text x="1035" y="344" class="small">DFT update</text>
<text x="850" y="551" class="small">Rotate every clock, including idle.</text>
<text x="644" y="575" class="muted">Savings: simpler Fourier storage access / hold logic</text>

<text x="24" y="630" class="label">Whole-chip NAND2 equivalents · same calculation</text>
<rect x="20" y="650" width="1160" height="112" rx="9" fill="#eef5f3"/>
<text x="52" y="687" class="muted">Indexed storage</text><text x="52" y="730" class="gate">265.7k</text>
<path d="M273 704H337" class="flow"/>
<text x="365" y="687" class="muted">Enabled rings</text><text x="365" y="730" class="gate">238.3k</text>
<path d="M565 704H629" class="flow"/>
<text x="657" y="687" class="muted">Continuous + sample buffer</text><text x="657" y="730" class="gate accent">199.5k</text>
<text x="1148" y="693" class="gate accent" text-anchor="end">−66.2k</text>
<text x="1148" y="725" class="label accent" text-anchor="end">24.9% smaller</text>
<text x="24" y="802" class="muted">All 14,400 Fourier bits retained · identical tested maps · no SRAM</text>
<text x="24" y="831" class="small">Final step vs enabled rings: 1.48× processing cycles; UART output time nearly unchanged. Power unmeasured.</text>
</svg>
