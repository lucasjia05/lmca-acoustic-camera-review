</g>
<text x="24" y="1070" class="heading">Whole-chip NAND2 equivalents · same calculation</text>
<rect x="20" y="1093" width="1580" height="120" rx="9" class="panel"/>
<text x="55" y="1130" class="muted">Indexed storage</text>
<text x="55" y="1180" class="gate">265.7k</text>
<text x="460" y="1130" class="muted">Enabled rings</text>
<text x="460" y="1180" class="gate">238.3k</text>
<text x="880" y="1130" class="muted">Continuous + sample buffer</text>
<text x="880" y="1180" class="gate accent">199.5k</text>
<path d="M330 1165H410" class="flow"/>
<path d="M745 1165H825" class="flow"/>
<text x="1555" y="1145" class="gate accent" text-anchor="end">−66.2k</text>
<text x="1555" y="1180" class="heading accent" text-anchor="end">24.9% smaller</text>
<text x="24" y="1252" class="muted">All 14,400 Fourier bits retained · identical tested maps · no SRAM</text>
<text x="24" y="1288" class="small">Final step vs enabled rings: 1.48× processing cycles; UART output time nearly unchanged. Power unmeasured.</text>
</svg>
