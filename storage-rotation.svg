<text x="410" y="391" class="small">Before: indexed registers</text>
<rect x="390" y="150" width="340" height="110" rx="6" class="box"/>
<text x="560.0" y="178" class="node" text-anchor="middle">Shared complex arithmetic</text>
<text x="560.0" y="203" class="small" text-anchor="middle">DFT / DAS</text>
<rect x="55" y="215" width="240" height="65" rx="6" class="box"/>
<text x="175.0" y="243" class="node" text-anchor="middle">Window coefficients</text>
<text x="175.0" y="268" class="small" text-anchor="middle">18-bit Q16</text>
<rect x="55" y="330" width="240" height="75" rx="6" class="box"/>
<text x="175.0" y="358" class="node" text-anchor="middle">Multiply</text>
<text x="175.0" y="383" class="small" text-anchor="middle">PCM × window</text>
<rect x="55" y="450" width="240" height="75" rx="6" class="box"/>
<text x="175.0" y="478" class="node" text-anchor="middle">Round + saturate</text>
<text x="175.0" y="503" class="small" text-anchor="middle">18-bit Q16 sample</text>
<path d="M175 280V330" class="flow"/>
<path d="M175 405V450" class="flow"/>
<path d="M25 368H55" class="flow"/>
<text x="34" y="318" class="tiny">PCM16</text>
<rect x="55" y="585" width="240" height="90" rx="6" class="box"/>
